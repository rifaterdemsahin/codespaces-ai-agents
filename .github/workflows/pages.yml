name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage site
        run: |
          mkdir -p _site
          python3 tests/test_system.py --json > _site/report.json || true
          cp index.html iphone.html test.html after-green.html agy-worked.html grok-worked.html codespace-url.html iphone-ssh.html termius.html termius-setup.html iphone-free.html vps.html cheapest-vps.html azure-idle.html azure-idle-vm.html why.html azure-vm-errors.html styles.css test.js nav.js copy.js _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
